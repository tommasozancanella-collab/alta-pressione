<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Alta Pressione</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pressione">
<meta name="theme-color" content="#16283A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
html { background: #16283A; -webkit-text-size-adjust: 100%; }
body { margin: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; } [hidden] { display: none !important; }
/* Impianto: app a schermo intero. In alto la barra con cassa e data, al centro la mappa o una schermata che scorre, in basso la navigazione. Le schede salgono dal basso. Tema unico, scelto apposta: cornice blu notte, mappa di giorno, accento giallo crema. */
:root {
  --chrome: #16283A; --chrome2: #213A52; --on-chrome: #EAF1F7; --on-chrome-muted: #9DB2C6;
  --accent: #FFC145; --accent-d: #D2941A; --accent-ink: #2A1E00;
  --bg: #EDF1F5; --surface: #FFFFFF; --surface2: #F2F5F8; --ink: #16283A; --muted: #5E7186; --line: #DAE1E8;
  --good: #1B9455; --warn: #B06A00; --bad: #D23F2C; --c1: #1B9455; --c2: #E08A00; --c3: #4C6FFF;
  --f-head: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--chrome); color: var(--ink); font: 500 15px/1.45 var(--f-body); overscroll-behavior: none; }
h1, h2, h3, h4 { font-family: var(--f-head); margin: 0; line-height: 1.2; text-wrap: balance; font-weight: 600; }
h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; } h4 { font-size: .78rem; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .86rem; }
.num { font-family: var(--f-head); font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 14px; min-height: 42px; font-weight: 700; box-shadow: 0 2px 0 var(--line); transition: transform .06s; }
button:active { transform: translateY(2px); box-shadow: none; }
button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-d); box-shadow: 0 3px 0 var(--accent-d); }
button.danger { color: var(--bad); border-color: var(--bad); background: transparent; box-shadow: none; }
button.ghost { background: transparent; box-shadow: none; }
button:disabled { opacity: .45; cursor: not-allowed; }
select, input[type=number], input[type=text] { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 42px; max-width: 100%; font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--accent-d); }

#app { height: 100%; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden; }

/* barra in alto */
.hud { background: var(--chrome); color: var(--on-chrome); padding: 8px var(--gr) 10px var(--gl); display: grid; gap: 8px; }
.hudrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand b { font-family: var(--f-head); font-size: 1.02rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { font-size: .78rem; color: var(--on-chrome-muted); }
.brand > div { min-width: 0; }
.money { display: flex; gap: 6px; flex: none; }
.chip { background: var(--chrome2); border-radius: 12px; padding: 4px 10px; display: grid; }
.chip span { font-size: .64rem; text-transform: uppercase; letter-spacing: .06em; color: var(--on-chrome-muted); }
.chip b { font-family: var(--f-head); font-variant-numeric: tabular-nums; font-size: .98rem; white-space: nowrap; }
.chip b.neg { color: #FF8E80; }
.hud button { background: var(--chrome2); color: var(--on-chrome); border-color: transparent; box-shadow: 0 2px 0 #0D1B29; min-height: 40px; padding: 8px 11px; white-space: nowrap; font-size: .95rem; }
.hud button.primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-d); }
.bell i { font-style: normal; background: var(--bad); color: #fff; border-radius: 99px; padding: 0 7px; margin-right: 7px; font-size: .8rem; }
.time { display: flex; gap: 6px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* centro */
.stage { flex: 1; min-height: 0; position: relative; display: flex; }
.scr { flex: 1; min-width: 0; overflow: auto; padding: 14px var(--gr) 28px var(--gl); display: grid; gap: 14px; align-content: start; }
.scr > section { display: grid; gap: 14px; }
.mapwrap { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #CFE3B4; touch-action: none; user-select: none; -webkit-user-select: none; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map .hit { cursor: pointer; }
.mapui { position: absolute; display: flex; gap: 6px; flex-wrap: wrap; }
.mapui.cities { top: 10px; left: var(--gl); right: 66px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 0 2px 8px; }
.mapui.cities::-webkit-scrollbar { display: none; }
.mapui.cities button { flex: none; white-space: nowrap; }
.mapui.cities button { border-radius: 99px; min-height: 36px; padding: 4px 13px; background: rgba(255,255,255,.94); box-shadow: 0 2px 6px rgba(20,40,60,.25); border-color: transparent; }
.mapui.cities button[aria-pressed=true] { background: var(--chrome); color: var(--on-chrome); }
.mapui.cities button small { font-weight: 600; opacity: .7; margin-left: 4px; }
.mapui.zoom { top: 10px; right: var(--gr); flex-direction: column; }
.mapui.zoom button { width: 42px; padding: 0; font-size: 1.3rem; background: rgba(255,255,255,.94); box-shadow: 0 2px 6px rgba(20,40,60,.25); border-color: transparent; }
.mapnote { position: absolute; left: var(--gl); right: var(--gr); bottom: 12px; background: rgba(255,255,255,.96); border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(20,40,60,.25); display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
.maplegend { position: absolute; left: var(--gl); bottom: 12px; background: rgba(255,255,255,.9); border-radius: 99px; padding: 5px 12px; font-size: .78rem; display: flex; gap: 12px; align-items: center; box-shadow: 0 2px 6px rgba(20,40,60,.2); }
.maplegend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.pin { cursor: pointer; }
.pin text { font: 700 11px var(--f-head); pointer-events: none; }
.pin .pb { fill: var(--accent); stroke: #2A1E00; stroke-width: 2; }
.pin .pi { fill: #fff; }
.pin .cup { fill: none; stroke: #2A1E00; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pin.build .pb { fill: #D9DEE4; stroke-dasharray: 4 3; }
.pin .sd { stroke: #fff; stroke-width: 2; }
.pin .sd.ok { fill: #1B9455; } .pin .sd.warn { fill: #F0A020; } .pin .sd.bad { fill: #D23F2C; }
.pin.co circle { stroke: #fff; stroke-width: 2.5; }
.pin.co text { fill: #fff; font-size: 10px; }
.pin.co.build { opacity: .5; }
.pin.plot .pl { fill: rgba(255,255,255,.92); stroke: #16283A; stroke-width: 2; stroke-dasharray: 4 3; }
.pin.plot .plx { stroke: #16283A; stroke-width: 2.5; stroke-linecap: round; }
.pin.lab rect { fill: rgba(22,40,58,.88); }
.pin.lab text { fill: #fff; font-size: 12px; }
.pin .pop rect { fill: #fff; stroke: #16283A; stroke-width: 1.5; }
.pin .pop text { font-size: 11px; }
.pin .pop { animation: pop 2.6s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px); } 12% { opacity: 1; transform: translateY(0); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }

/* navigazione in basso */
.nav { display: flex; background: var(--chrome); padding: 4px max(6px, env(safe-area-inset-right, 0px)) 6px max(6px, env(safe-area-inset-left, 0px)); gap: 2px; }
.nav button { flex: 1; background: transparent; border: 0; box-shadow: none; color: var(--on-chrome-muted); display: grid; justify-items: center; gap: 1px; padding: 6px 2px; font-size: .72rem; font-weight: 700; border-radius: 12px; min-width: 0; }
.nav button[aria-current=page] { color: var(--accent); background: var(--chrome2); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border-radius: 99px; padding: 5px 14px; min-height: 36px; }
.seg button[aria-pressed=true] { background: var(--chrome); color: var(--on-chrome); border-color: var(--chrome); box-shadow: none; }

/* schede dal basso */
.backdrop { position: absolute; inset: 0; background: rgba(10,22,34,.42); z-index: 15; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; max-width: 760px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; z-index: 16; display: flex; flex-direction: column; box-shadow: 0 -10px 34px rgba(0,0,0,.3); }
.sheethead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px var(--gr) 8px var(--gl); }
.sheethead::before { content: ""; position: absolute; top: 6px; left: 50%; width: 44px; height: 4px; margin-left: -22px; border-radius: 4px; background: var(--line); }
.sheethead button { min-height: 36px; width: 36px; padding: 0; border-radius: 50%; font-size: 1.2rem; flex: none; }
.sheetbody { overflow: auto; padding: 4px var(--gr) 22px var(--gl); display: grid; gap: 12px; }
.sheetbody .shopbody { padding: 0; border: 0; }

/* contenuti */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 2px 0 var(--line); min-width: 0; }
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-width: 0; box-shadow: 0 2px 0 var(--line); }
.tile > span { display: block; font-size: .76rem; color: var(--muted); font-weight: 700; }
.tile b { display: block; font-family: var(--f-head); font-size: 1.35rem; font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.tile small { color: var(--muted); }
.tiles.t3 { grid-template-columns: repeat(3, 1fr); } .tiles.t3 .tile b { font-size: 1.1rem; }
.tiles.t4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px) {
  .tiles { grid-template-columns: repeat(6, 1fr); } .tiles.t4 { grid-template-columns: repeat(4, 1fr); }
  .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: repeat(3, 1fr); }
}
.chartbox { overflow-x: auto; }
svg.chart { display: block; max-width: 100%; height: auto; }
svg.chart text { fill: var(--muted); font: 11px var(--f-body); }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
svg.chart .l1 { stroke: var(--c1); fill: none; stroke-width: 2.6; } svg.chart .l2 { stroke: var(--c2); fill: none; stroke-width: 2.6; } svg.chart .l3 { stroke: var(--c3); fill: none; stroke-width: 2.6; }
svg.chart .d1 { fill: var(--c1); } svg.chart .d2 { fill: var(--c2); } svg.chart .d3 { fill: var(--c3); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.alerts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.alerts li { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--muted); }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: #F0A020; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; }
tr.me td, tr.tot td { font-weight: 800; background: var(--surface2); }
table.fin td, table.fin th { white-space: nowrap; } table.fin td:first-child { white-space: normal; min-width: 150px; }
.bar { height: 10px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.bar.warn > i { background: #F0A020; } .bar.bad > i { background: var(--bad); }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .75rem; font-weight: 800; border: 1.5px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.good { color: var(--good); border-color: var(--good); } .pill.bad { color: var(--bad); border-color: var(--bad); } .pill.warn { color: var(--warn); border-color: #F0A020; }
.shop { padding: 0; overflow: hidden; } .shop.on { border-color: var(--accent-d); }
.rowbtn { width: 100%; border: 0; border-radius: 0; background: transparent; box-shadow: none; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: center; padding: 12px 14px; text-align: left; font-weight: 600; }
.rowbtn:hover { background: var(--surface2); }
.rowbtn .rn { min-width: 0; }
.rowbtn .rs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.rowbtn .rs .good { color: var(--good); } .rowbtn .rs .bad { color: var(--bad); } .rowbtn .rs .warn { color: var(--warn); }
.shopbody { display: grid; gap: 12px; padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stats div { background: var(--surface2); border-radius: 12px; padding: 8px 10px; }
.stats div span { display: block; font-size: .72rem; color: var(--muted); font-weight: 700; }
.stats div b { font-family: var(--f-head); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.controls { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .controls { grid-template-columns: repeat(2, 1fr); } }
.ctl { display: grid; gap: 4px; min-width: 0; align-content: start; }
.ctl > label, .ctl > .lbl { font-size: .8rem; color: var(--muted); font-weight: 800; }
.step { display: grid; grid-template-columns: 46px 1fr 46px; gap: 6px; align-items: center; }
.step button { padding: 0; font-size: 1.3rem; }
.step output { text-align: center; font-family: var(--f-head); font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.hint { font-size: .84rem; color: var(--muted); } .hint.warn { color: var(--warn); } .hint.bad { color: var(--bad); }
.preview { background: #FFF6DC; border: 1.5px solid var(--accent); border-radius: 12px; padding: 8px 10px; }
details { border-top: 1px solid var(--line); padding-top: 8px; } details.card { border-top: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; } .row.sp { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.pick { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .pick.three { grid-template-columns: repeat(3, 1fr); } }
.opt { text-align: left; display: grid; gap: 2px; height: 100%; font-weight: 600; }
.opt b { font-family: var(--f-head); font-size: 1.02rem; }
.opt[aria-pressed=true] { border-color: var(--accent-d); background: #FFF6DC; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log li { display: grid; grid-template-columns: 96px 10px 1fr; gap: 10px; align-items: start; }
.log time { font-size: .8rem; color: var(--muted); }
.sparkline { width: 84px; height: 24px; } .sparkline polyline { fill: none; stroke: var(--c3); stroke-width: 1.8; }
.sl { display: grid; grid-template-columns: 112px 1fr 38px; gap: 8px; align-items: center; font-size: .85rem; } .sl b { text-align: right; font-variant-numeric: tabular-nums; }
.guide p { max-width: 68ch; } .ghead { margin-top: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); color: var(--on-chrome); padding: 10px 16px; border-radius: 14px; z-index: 60; max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgba(0,0,0,.3); font-weight: 700; }
.toast.err { background: var(--bad); color: #fff; }
.modal { position: fixed; inset: 0; background: rgba(8,18,28,.66); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal > div { background: var(--surface); border-radius: 22px; padding: 20px; max-width: 520px; width: 100%; display: grid; gap: 12px; max-height: 90vh; overflow: auto; border-top: 8px solid var(--accent); }
.modal .opt { width: 100%; }
/* schermata iniziale */
.startwrap { flex: 1; position: relative; overflow: auto; display: grid; place-items: center; padding: 20px var(--gr) 20px var(--gl); }
.startbg { position: absolute; inset: 0; } .startbg svg { width: 100%; height: 100%; display: block; }
.startbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(22,40,58,.55), rgba(22,40,58,.82)); }
.start { position: relative; display: grid; gap: 16px; max-width: 640px; width: 100%; }
.start h1 { font-size: 2.6rem; color: #fff; }
.start > div > p.lead { color: #E3ECF4; margin-top: 6px; }
.start > p { color: #D5E0EA; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .pin .pop { animation: none; } }

/* --- Alta Pressione: mappa a zone --- */
.pin.zone .zb { fill: #fff; stroke: #16283A; stroke-width: 2.5; }
.pin.zone .zr { fill: none; stroke: #DAE1E8; stroke-width: 5; }
.pin.zone .zs { fill: none; stroke-width: 5; stroke-linecap: round; }
.pin.zone .zs.ok { stroke: #1B9455; } .pin.zone .zs.warn { stroke: #F0A020; } .pin.zone .zs.bad { stroke: #D23F2C; } .pin.zone .zs.none { stroke: #9DB2C6; }
.pin.zone .zt { font: 700 12.5px var(--f-head); fill: #16283A; }
.pin.zone .zl { fill: rgba(22,40,58,.9); }
.pin.zone .zn { font: 700 12px var(--f-head); fill: #fff; }
.pin.zone .dp { fill: var(--accent); stroke: #2A1E00; stroke-width: 2; }
.pin.zone .dpi { fill: none; stroke: #2A1E00; stroke-width: 1.8; stroke-linejoin: round; }
.pin.zone .db { fill: #16283A; stroke: #fff; stroke-width: 1.5; }
.pin.zone .dbt { font: 700 10.5px var(--f-head); fill: #fff; }
.pin.zone .rp { fill: #4C6FFF; stroke: #fff; stroke-width: 2; }
.pin.zone .rpi { fill: #fff; }
.maplegend { flex-wrap: wrap; row-gap: 2px; max-width: calc(100% - 90px); }
/* interruttore */
.tgl { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; background: var(--surface2); box-shadow: none; font-weight: 700; }
.tgl i { flex: none; width: 42px; height: 24px; border-radius: 99px; background: #C3CDD8; position: relative; transition: background .15s; }
.tgl i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.tgl[aria-pressed=true] i { background: var(--good); } .tgl[aria-pressed=true] i::after { left: 21px; }
button.lnk { background: none; border: 0; box-shadow: none; padding: 0; min-height: 0; font-weight: 800; color: #2848C8; text-decoration: underline; text-underline-offset: 3px; }
.step output small { font: 700 .78rem var(--f-body); }

.sheetbody { grid-auto-rows: max-content; align-content: start; }
.mapui.zoom { left: var(--gl); right: auto; }
.card.stack { align-content: start; }

.opts > div { border-top: 1px solid var(--line); padding: 12px 0; display: grid; gap: 5px; } .opts > div:first-child { border-top: 0; }
.opts .row.sp { align-items: flex-start; gap: 8px; } .opts .row.sp b { min-width: 0; }

.alerts li span { display: grid; gap: 6px; justify-items: start; }

/* Da iOS 26 il telefono sfoca la pagina sotto la barra di stato. Quando il gioco finisce lì sotto, si lascia un po' di spazio in più

/* Bordi dello schermo del telefono. Tre cose: allunga la pagina se il telefono la tiene più corta dello schermo; sposta il gioco in basso
   se finisce sotto l'orologio senza che il telefono lo dichiari; lascia al giocatore una regolazione a mano (Altro, Guida, Schermo). */
(function () {
  var VERSION = 'v9', KEY = 'alta-pressione-schermo', nav = window.navigator;
  var sa = !!(nav.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  var ios = /iPhone|iPad|iPod/.test(nav.userAgent) || (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1);
  function mk(side) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-' + side + ',0px);visibility:hidden;pointer-events:none'; document.documentElement.appendChild(d); return d; }
  var pT = mk('top'), pB = mk('bottom'), user = 0, st = { auto: 0 }; try { user = +window.localStorage.getItem(KEY) || 0; } catch (e) { /* ignora */ }
  function fit() {
    var top = pT.offsetHeight, ih = window.innerHeight, sh = window.screen.height, portrait = ih >= window.innerWidth, gap = sh - ih, auto = 0, h = '';
    if (sa && ios && portrait) {
      if (top > 0 && gap > 8 && gap < 90) h = sh + 'px';                    // pagina più corta dello schermo: resterebbe una fascia vuota in basso
      if (top === 0 && Math.abs(gap) < 8) auto = Math.round(sh * 0.094);    // il gioco è sotto l'orologio ma il telefono dichiara margine zero
    }
    document.documentElement.style.height = h;
    document.documentElement.style.setProperty('--top-extra', Math.max(-Math.round(top * 1.36), auto + user) + 'px');
    st = { auto: auto, top: top, bot: pB.offsetHeight, ih: ih, iw: window.innerWidth, sh: sh, sw: window.screen.width, tall: h ? 1 : 0 };
  }
  window.APscreen = {
    user: function () { return user; },
    nudge: function (d) { user = Math.max(-120, Math.min(160, user + d)); try { window.localStorage.setItem(KEY, String(user)); } catch (e) { /* ignora */ } fit(); },
    info: function () { fit(); return 'Versione ' + VERSION.replace('v', '') + ' · app ' + (sa ? 'sì' : 'no') + ' · schermo ' + st.sw + '×' + st.sh + ' · finestra ' + st.iw + '×' + st.ih + ' · margini del telefono ' + st.top + '/' + st.bot + ' · automatico ' + st.auto + (st.tall ? ' · allungata' : '') + ' · tuo ' + user; }
  };
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function () { setTimeout(fit, 350); }); setTimeout(fit, 500);
})();
</script>
